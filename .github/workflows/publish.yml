name: Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: setup deno
        uses: denoland/setup-deno@v2
      - name: Publish package
        run: deno publish